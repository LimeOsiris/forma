name: Feature or format request
description: Suggest a new conversion, editor tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Forma to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: How do you do this today, and what makes it painful?
